[package]
name = "manhattan-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manhattan-kernel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rand = "0.8"

[dev-dependencies]
pretty_assertions = "1"

[[test]]
name = "arc_e2e"
path = "tests/arc_e2e_test.rs"

[[test]]
name = "arc_hypothesis"
path = "tests/arc_hypothesis_test.rs"
