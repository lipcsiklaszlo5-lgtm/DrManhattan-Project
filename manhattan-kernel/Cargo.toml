[package]
name = "manhattan-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manhattan-kernel"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
pretty_assertions = "1.4"
