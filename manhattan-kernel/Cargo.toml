[package]
name = "manhattan-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manhattan-kernel"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
pretty_assertions = "1.4"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }

[[bin]]
name = "arc_simple_eval"
path = "src/bin/arc_simple_eval.rs"

[[bin]]
name = "arc_fast_eval"
path = "src/bin/arc_fast_eval.rs"

[[bin]]
name = "arc_accurate_eval"
path = "src/bin/arc_accurate_eval.rs"


[[bin]]
name = "arc_abstraction_coverage"
path = "src/bin/arc_abstraction_coverage.rs"
