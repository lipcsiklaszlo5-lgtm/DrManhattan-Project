[package]
name = "manhattan-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manhattan-kernel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rand = "0.8"

[dev-dependencies]
pretty_assertions = "1"

[[test]]
name = "arc_e2e"
path = "tests/arc_e2e_test.rs"

[[test]]
name = "arc_hypothesis"
path = "tests/arc_hypothesis_test.rs"

[[test]]
name = "arc_translate_recolor"
path = "tests/arc_translate_recolor_test.rs"

[[test]]
name = "unit_program_synthesizer"
path = "tests/unit_program_synthesizer_test.rs"

[[test]]
name = "arc_multi_op"
path = "tests/arc_multi_op_test.rs"

[[test]]
name = "unit_generalize"
path = "tests/unit_generalize_test.rs"

[[test]]
name = "arc_generalize"
path = "tests/arc_generalize_test.rs"

[[test]]
name = "unit_abstract_recolor"
path = "tests/unit_abstract_recolor_test.rs"

[[test]]
name = "unit_rotate"
path = "tests/unit_rotate_test.rs"

[[test]]
name = "arc_compose"
path = "tests/arc_compose_test.rs"
